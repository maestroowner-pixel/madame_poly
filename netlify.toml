# Бывшая выкладка веб-версии на Netlify (сайт madamepoly-app). С 2026-10-01 веб — на Firebase Hosting (firebase.json); файл оставлен на случай возврата.
# Лендинг madamepoly.kuka-lab.com — отдельный сайт Netlify, этот файл его не касается.
[build]
  publish = "dist"

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
